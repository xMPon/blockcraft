name: Sync roadmap project

on:
  push:
    branches: [main]
    paths:
      - TODO.md
      - scripts/sync-roadmap-project.mjs
      - .github/workflows/sync-roadmap-project.yml
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync TODO items into GitHub Project
        env:
          GITHUB_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN || github.token }}
          ROADMAP_PROJECT_OWNER: ${{ vars.ROADMAP_PROJECT_OWNER || github.repository_owner }}
          ROADMAP_PROJECT_NUMBER: ${{ vars.ROADMAP_PROJECT_NUMBER || 3 }}
          ROADMAP_SOURCE_FILE: TODO.md
        run: node scripts/sync-roadmap-project.mjs
